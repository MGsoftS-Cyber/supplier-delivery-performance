services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supply
      POSTGRES_USER: supply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - supply_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply -d supply"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8086:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://supply:${POSTGRES_PASSWORD}@db:5432/supply
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8086,http://127.0.0.1:8086}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  supply_postgres:
